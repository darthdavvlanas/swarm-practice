services:
  reverse-proxy:
    image: haproxy:2.4
    restart: always
    networks:
      - backend
    ports:
      - "8080:8080"
    volumes:
      - ./haproxy/reverse/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:rw

  ingress-proxy:
    image: nginx:latest
    restart: always
    ports:
      - "8090:8090"
    networks:
      - backend
    volumes:
      - ./nginx/ingress/default.conf:/etc/nginx/conf.d/default.conf:rw
      - ./nginx/ingress/nginx.conf:/etc/nginx/nginx.conf:rw

  web:
    image: cr.yandex/crpt75mlr0lmfrrgeng0/myapp:1.1.0
    restart: unless-stopped
    networks:
      - backend
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      DB_TABLE: ${DB_TABLE:-requests}

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - backend

networks:
  backend:
    driver: overlay
    ipam:
      config:
        - subnet: 172.20.0.0/24
